<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Tidak Ditemukan</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .error {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 70px;
            margin: 0;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="error">
        <h1>404</h1>

        <h2>Halaman tidak ditemukan 😭</h2>

        <p>
            Sepertinya URL yang kamu masukkan salah.
        </p>

        <a href="/">
            Kembali ke halaman utama
        </a>
    </div>

</body>
</html>
